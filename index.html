<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Joshua — Official Links</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(45,0,100,.35), transparent 35%),
    linear-gradient(145deg,#09080d,#130718 55%,#08080c);
  color: #fff;
  display: flex;
  justify-content: center;
}

.wrap {
  width: 100%;
  max-width: 560px;
  padding: 42px 20px 50px;
  text-align: center;
}

.avatar {
  width: 118px;
  height: 118px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 18px;
  border: 3px solid rgba(255,255,255,.9);
  box-shadow: 0 0 28px rgba(70,35,255,.55);
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: .5px;
}

.subtitle {
  margin: 7px 0 10px;
  color: #bdbdbd;
  font-size: 14px;
}

.email {
  display: inline-block;
  color: #ddd;
  text-decoration: none;
  font-size: 13px;
  margin-bottom: 15px;
}

.group-title {
  text-align: left;
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 1.6px;
  margin: 24px 4px 9px;
}

.button {
  display: block;
  text-decoration: none;
  color: #fff;
  background: rgba(35,35,39,.92);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 13px;
  padding: 16px 18px;
  margin: 10px 0;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 5px 18px rgba(0,0,0,.18);
}

.small {
  font-size: 12px;
  font-weight: 500;
  color: #aaa;
}

footer {
  margin-top: 28px;
  color: #666;
  font-size: 11px;
}
</style>
</head>

<body>

<main class="wrap">

  <img class="avatar"
       src="https://raw.githubusercontent.com/deejayjoshua-maker/dj-joshua-links/main/joshua.png"
       alt="DJ Joshua">

  <h1>DJ Joshua</h1>

  <div class="subtitle">
    DJ • Producer • Remixer
  </div>

  <a class="email" href="mailto:deejay.joshua@gmail.com">
    ✉ deejay.joshua@gmail.com
  </a>

  <div class="group-title">
    Beatport — Artists
  </div>

  <a class="button"
     href="https://www.beatport.com/artist/k-joshua/1189727"
     target="_blank">
    K-Joshua <span class="small">— Beatport</span>
  </a>

  <a class="button"
     href="https://www.beatport.com/artist/joshua-marian/1232028"
     target="_blank">
    Joshua Marian <span class="small">— Beatport</span>
  </a>

  <a class="button"
     href="https://www.beatport.com/artist/joshua-onairam/1223017"
     target="_blank">
    Joshua Onairam <span class="small">— Beatport</span>
  </a>

  <a class="button"
     href="https://www.beatport.com/artist/joshua-fernand/1204521"
     target="_blank">
    Joshua Fernand <span class="small">— Beatport</span>
  </a>

  <div class="group-title">
    Music
  </div>

  <a class="button"
     href="https://jflmrecordings.bandcamp.com/"
     target="_blank">
    💿 JFLM Recordings — Bandcamp
  </a>

  <a class="button"
     href="https://soundcloud.com/dj-joshua"
     target="_blank">
    🔊 SoundCloud
  </a>

  <a class="button"
     href="https://www.youtube.com/@djjoshua1452"
     target="_blank">
    ▶ YouTube
  </a>

  <footer>
    Official links — DJ Joshua
  </footer>

</main>

</body>
</html>
